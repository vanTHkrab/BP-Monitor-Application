services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api-gateway:
    build:
      target: dev
    command: pnpm start:dev
    volumes:
      - ../../server/app/api-gateway:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

  ai-service:
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000
    volumes:
      - ../../server/app/ai-service:/app
      # Source-tree bind above shadows /app/models with the host directory.
      # Re-layer the named volume so model artifacts still cache across
      # container recreates (and so the host repo doesn't accumulate them).
      - ai_models:/app/models
    ports:
      - "8000:8000"
    environment:
      ENV: development

  # `web` is defined here in full rather than in docker-compose.yml, because an
  # override file can change a service but cannot remove one — a definition in
  # the base would leak into the prod stack, which deliberately does not run
  # the dashboard. See the note where it used to be.
  web:
    build:
      # Repository root, not web/ — the docs site prerenders `docs/**/*.md`,
      # and a context rooted at web/ cannot reach a sibling directory. The
      # root `.dockerignore` keeps the widened context down to web/ + docs/.
      context: ../..
      dockerfile: web/Dockerfile
      target: dev
    command: pnpm dev
    volumes:
      - ../../web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway
    networks:
      - bp-net
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Server Actions (web/src/lib/gateway.ts, web/src/lib/ai-service.ts) read
      # these at request time and default to `http://localhost:*` if unset —
      # which inside this container resolves to the `web` container itself, not
      # api-gateway/ai-service.
      GATEWAY_URL: http://api-gateway:3000
      AI_SERVICE_URL: http://ai-service:8000
      # The dashboard is a fifth consumer of the datastores, not a gateway
      # client: web/src/lib/{db,redis,s3}.ts open their own connections. None of
      # these were wired before, so every /admin/ page except the gateway probe
      # reported its service as down in Compose, with nothing in a log to say
      # the client had simply never been pointed anywhere. `localhost` inside
      # this container is this container.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_PROVIDER: ${S3_PROVIDER}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_DEFAULT_REGION: ${S3_DEFAULT_REGION}
