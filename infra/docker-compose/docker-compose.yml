name: bp-monitor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bp-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bp-net

  api-gateway:
    build:
      context: ../../server/app/api-gateway
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
      PORT: 3000
      S3_PROVIDER: ${S3_PROVIDER}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_DEFAULT_REGION: ${S3_DEFAULT_REGION}
      S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      # ── Auth domain ─────────────────────────────────────────────────────
      # None of these were forwarded before, so passkeys and Google sign-in
      # were off in every containerised environment and `/api/auth/*` 404'd.
      # Each one degrades silently rather than failing at boot, which is
      # exactly why they have to be wired here rather than remembered.
      #
      # BETTER_AUTH_URL is ORIGIN ONLY — Better Auth appends `/api/auth`
      # itself and discards any other path with a warning. Unset, every route
      # under /api/auth 404s, including the mobile app's email-OTP calls
      # (client/src/modules/auth/services/email-otp-api.ts).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # Falls back to JWT_SECRET when empty. Set it in production so rotating
      # one does not silently rotate the other.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # A bare registered domain — never an IP, port or scheme; the gateway
      # throws at boot on those. Unset means the passkey plugin is not loaded
      # at all and the app hides the section rather than showing it broken.
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-}
      ANDROID_APP_PACKAGE_NAME: ${ANDROID_APP_PACKAGE_NAME:-}
      # Keytool's colon-separated SHA-256 bytes, comma-separated across debug,
      # release and Play App Signing keys. Served at
      # /.well-known/assetlinks.json and converted into the
      # `android:apk-key-hash:` origin Android actually presents.
      ANDROID_APP_SHA256_FINGERPRINT: ${ANDROID_APP_SHA256_FINGERPRINT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      # Unset, Expo accepts a push send from anyone holding one of our push
      # tokens. Push works without it; nothing fails at boot.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      HAVE_I_BEEN_PWNED_ENABLED: ${HAVE_I_BEEN_PWNED_ENABLED:-}
      # ── Email delivery ──────────────────────────────────────────────────
      # Listed one by one like everything above, because Compose forwards
      # only what is named here: a variable set in .env but missing from this
      # block simply never reaches the container. That is the same failure
      # that had BETTER_AUTH_URL unset in every containerised environment.
      #
      # Unset SMTP_HOST means the gateway logs the code in development and
      # THROWS in production — email verification and password reset are
      # broken, loudly, rather than silently dropped.
      SMTP_HOST: ${SMTP_HOST:-}
      # 587 (STARTTLS) or 465 (implicit TLS). Outbound 25 is blocked at the
      # cloud-provider level, outside Docker, so no Compose setting helps.
      SMTP_PORT: ${SMTP_PORT:-587}
      # For Resend this is the literal string "resend", not an email address.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Must be on a domain the provider has verified, or every send fails.
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bp-net

  ai-service:
    build:
      context: ../../server/app/ai-service
      dockerfile: Dockerfile
    environment:
      # `main.py` reads REDIS_URL and nothing else — REDIS_HOST/REDIS_PORT
      # were set here and silently ignored, so the subscriber fell back to
      # `redis://localhost:6379`, which inside this container is this
      # container. It subscribed to a Redis nobody publishes to and the whole
      # analysis path was dead in Compose, with no error on either side: the
      # gateway published successfully to the real Redis and simply never
      # got a reply.
      REDIS_URL: redis://redis:6379
      # Public R2 base URL the entrypoint downloads model artifacts from.
      # docker-entrypoint.sh refuses to start if this is unset or still
      # the placeholder value.
      AI_MODELS_R2_BASE_URL: ${AI_MODELS_R2_BASE_URL}
    volumes:
      # Persist downloaded model artifacts across container recreates so the
      # entrypoint's curl-from-R2 step only runs once per host.
      - ai_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    # The reply path is Redis pub/sub — fan-out, no ack, no persistence.
    # It is correct only while exactly ONE subscriber exists: a second
    # replica would analyse every image twice. Do not scale this service
    # until the reply transport moves to a Redis Streams consumer group
    # (see docs/research/ai-service-reply-transport.md).
    deploy:
      replicas: 1
    restart: unless-stopped
    # `/ready`, not `/health`. `/health` proves only that FastAPI is
    # answering — it stays green when Redis is unreachable or the
    # subscriber task has died, which is exactly the state this probe
    # exists to catch. start_period covers the first-boot model download
    # from R2 plus ONNX session construction.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks:
      - bp-net

  # NOTE: there is no `web` service here. It lives in docker-compose.dev.yml.
  #
  # That is not tidiness — it is the only way Compose can express "not in
  # production". An override file can change a service but cannot delete one,
  # so a `web` block in this base file would start in every stack that includes
  # it, prod overlay included. `web` is deliberately not deployed: it has no
  # authentication of its own, its /admin/ pages open direct connections to
  # Postgres, Redis and S3, and the only thing that ever guarded them was an
  # nginx Basic Auth rule. Defining it in the dev overlay makes the dev stack
  # the only one that can run it.

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  bp-net:
    driver: bridge
